[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "store_performance_diagnosis"
version = "0.1.0"
description = "门店经营异常诊断与行动效果回看（本地合成资料）"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.scripts]
store-diagnosis = "store_performance_diagnosis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
